<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Витрина — баннер приветствия бота</title>
<!--
  The picture on the MAX bot's welcome message. Rendered to
  frontend/public/brand/max-welcome.jpg (see README), which MAX downloads itself when the
  bot sends the message. It shows at the width of a chat bubble - about 330px on a phone -
  so the type is set far larger than on a slide, and there is very little of it.
  Same field as the deck's cover: AIRuntime's space lit by the MAX gradient.
-->
<style>
  @page { size: 1200px 630px; margin: 0; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .banner {
    position: relative;
    width: 1200px; height: 630px; overflow: hidden;
    background: #05070f url("bg-cover.jpg") 62% 50% / cover no-repeat;
    color: #fff;
  }
  .copy {
    position: absolute; left: 76px; top: 0; bottom: 0; width: 640px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .lockup { display: flex; align-items: center; gap: 14px; margin-bottom: 30px; font-size: 26px; font-weight: 800; letter-spacing: .04em; }
  .lockup img { width: 42px; height: 42px; }
  .lockup .x { font-weight: 300; color: rgba(255,255,255,.6); letter-spacing: 0; }
  .lockup .max { display: inline-flex; align-items: center; gap: 10px; letter-spacing: -.01em; font-size: 29px; }
  .lockup .dot { width: 31px; height: 31px; border-radius: 50%; background: #fff; display: inline-flex; align-items: center; justify-content: center; }
  .lockup .dot i { width: 11px; height: 11px; border-radius: 50%; background: #0077ff; display: block; }
  h1 { margin: 0; font-size: 150px; line-height: .92; letter-spacing: -.05em; font-weight: 800; }
  .lead { margin: 26px 0 0; font-size: 38px; line-height: 1.25; color: rgba(234,241,255,.88); letter-spacing: -.01em; }
  .lead b { color: #fff; font-weight: 700; }

  .phone {
    --pw: 272px;
    position: absolute; left: 846px; top: 44px;
    width: var(--pw);
    border-radius: calc(var(--pw) * .082); padding: calc(var(--pw) * .026);
    background: linear-gradient(160deg, #2e374c, #141a28);
    box-shadow: 0 34px 70px -26px rgba(0,0,0,.9), inset 0 0 0 1px rgba(255,255,255,.08);
  }
  .phone img { display: block; width: 100%; aspect-ratio: 1 / 2; border-radius: calc(var(--pw) * .06); }
</style>
</head>
<body>
  <div class="banner">
    <div class="copy">
      <div class="lockup">
        <img src="mark-airuntime.png" alt="" />
        <span>AIRUNTIME</span>
        <span class="x">×</span>
        <span class="max"><span class="dot"><i></i></span>max</span>
      </div>
      <h1>Витрина</h1>
      <p class="lead">Запись к вам&nbsp;— <b>прямо в&nbsp;MAX</b>.<br />Из одного сообщения.</p>
    </div>
    <div class="phone"><img src="shot-storefront.png" alt="" /></div>
  </div>
</body>
</html>
