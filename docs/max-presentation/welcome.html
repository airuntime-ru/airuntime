<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>AIRuntime — баннер приветствия бота</title>
<!--
  Rendered to frontend/public/brand/max-welcome-v5.jpg.

  MAX's API prefers a 16:9 still. The chat bubble then cover-crops toward a taller
  frame and rounds the corners, which ate the left of v4 (120px inset). Content now
  sits in a ~1:1 safe column so a letter is not lost to the crop or the radius.
-->
<style>
  html, body { margin: 0; padding: 0; width: 1280px; height: 720px; overflow: hidden; }
  body {
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .banner {
    position: relative;
    width: 1280px; height: 720px; overflow: hidden;
    background: #05070f url("bg-cover.jpg") 50% 50% / cover no-repeat;
    color: #fff;
  }
  .copy {
    position: absolute; left: 310px; top: 0; bottom: 0; width: 430px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .lockup { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; font-size: 18px; font-weight: 800; letter-spacing: .04em; }
  .lockup img { width: 32px; height: 32px; }
  .lockup .x { font-weight: 300; color: rgba(255,255,255,.6); letter-spacing: 0; }
  .lockup .max { display: inline-flex; align-items: center; gap: 8px; letter-spacing: -.01em; font-size: 20px; }
  .lockup .max img { width: 32px; height: 32px; }
  h1 { margin: 0; font-size: 56px; line-height: .95; letter-spacing: -.05em; font-weight: 800; }
  .lead { margin: 16px 0 0; font-size: 24px; line-height: 1.28; color: rgba(234,241,255,.88); letter-spacing: -.01em; }
  .lead b { color: #fff; font-weight: 700; }

  .phone {
    --pw: 170px;
    position: absolute; right: 310px; top: 50%; transform: translateY(-50%);
    width: var(--pw);
    border-radius: calc(var(--pw) * .082); padding: calc(var(--pw) * .026);
    background: linear-gradient(160deg, #2e374c, #141a28);
    box-shadow: 0 34px 70px -26px rgba(0,0,0,.9), inset 0 0 0 1px rgba(255,255,255,.08);
  }
  .phone img { display: block; width: 100%; aspect-ratio: 1 / 2; border-radius: calc(var(--pw) * .06); }
</style>
</head>
<body>
  <div class="banner">
    <div class="copy">
      <div class="lockup">
        <img src="mark-airuntime.png" alt="" />
        <span>AIRUNTIME</span>
        <span class="x">×</span>
        <span class="max"><img src="mark-max.png" alt="" />max</span>
      </div>
      <h1>AIRuntime</h1>
      <p class="lead">Запись к вам&nbsp;— <b>прямо в&nbsp;MAX</b>.<br />Соберите в приложении.</p>
    </div>
    <div class="phone"><img src="shot-storefront.png" alt="" /></div>
  </div>
</body>
</html>
