[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend/src", "tests", "scripts", "admin"]
extend-exclude = ["admin/core/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501", "UP047"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
source = ["src"]
omit = ["*/db/migrations/*"]

[tool.coverage.report]
show_missing = true

