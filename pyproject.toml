[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend/src", "agents", "tests", "scripts", "admin"]
extend-exclude = ["admin/core/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["src", "agents"]

[tool.ruff.format]
quote-style = "double"
