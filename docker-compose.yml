name: airuntime

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: airuntime
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d airuntime"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: airuntime
      MINIO_ROOT_PASSWORD: airuntime-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 airuntime airuntime-secret; do sleep 1; done;
      mc mb local/airuntime-files --ignore-existing;
      mc anonymous set none local/airuntime-files;
      exit 0;
      "

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/airuntime
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: change-me
      APP_DOMAIN: airuntime.ru
      FRONTEND_URL: http://localhost:3000
      API_URL: http://localhost:8000
      ALLOWED_ORIGINS: http://localhost:3000
      ALLOWED_HOSTS: localhost,127.0.0.1
      PROVIDER_NAME: openai
      DEPLOYMENT_DEFAULT_IMAGE: nginx:alpine
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: airuntime
      S3_SECRET_KEY: airuntime-secret
      S3_BUCKET: airuntime-files
    volumes:
      - airruntime_projects_data:/data/airruntime-projects
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/airuntime
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: change-me
      APP_DOMAIN: airuntime.ru
      FRONTEND_URL: http://localhost:3000
      API_URL: http://localhost:8000
      PROVIDER_NAME: openai
      DEPLOYMENT_DEFAULT_IMAGE: nginx:alpine
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: airuntime
      S3_SECRET_KEY: airuntime-secret
      S3_BUCKET: airuntime-files
    command: ["sh", "/app/entrypoint.sh", "worker"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - airruntime_projects_data:/data/airruntime-projects
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

  django-admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    environment:
      DJANGO_SECRET_KEY: change-me
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:8001
      DJANGO_SUPERUSER_EMAIL: admin@airuntime.ru
      DJANGO_SUPERUSER_PASSWORD: admin123
      POSTGRES_DB: airuntime
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: postgres
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
        NEXT_PUBLIC_BASE_DOMAIN: airuntime.ru
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_BASE_DOMAIN: airuntime.ru
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
  airruntime_projects_data:
