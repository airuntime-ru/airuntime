name: airuntime

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16
    logging: *default-logging
    environment:
      POSTGRES_DB: airuntime
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d airuntime"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    logging: *default-logging
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    logging: *default-logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: airuntime
      MINIO_ROOT_PASSWORD: airuntime-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    logging: *default-logging
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 airuntime airuntime-secret; do sleep 1; done;
      mc mb local/airuntime-files --ignore-existing;
      mc anonymous set none local/airuntime-files;
      exit 0;
      "

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    logging: *default-logging
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/airuntime
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: change-me
      APP_DOMAIN: airuntime.ru
      FRONTEND_URL: http://localhost:3000
      API_URL: http://localhost:8000
      ALLOWED_ORIGINS: http://localhost:3000
      ALLOWED_HOSTS: localhost,127.0.0.1
      PROVIDER_NAME: ${PROVIDER_NAME:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Splits a big openai-provider turn into sequential subtasks - see orchestrator.py's
      # module docstring before flipping this on (least-verified piece of the Codex work).
      ENABLE_AGENT_ORCHESTRATOR: ${ENABLE_AGENT_ORCHESTRATOR:-false}
      DEPLOYMENT_DEFAULT_IMAGE: nginx:alpine
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: airuntime
      S3_SECRET_KEY: airuntime-secret
      S3_BUCKET: airuntime-files
    volumes:
      - airruntime_projects_data:/data/airruntime-projects
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    logging: *default-logging
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/airuntime
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: change-me
      APP_DOMAIN: airuntime.ru
      FRONTEND_URL: http://localhost:3000
      API_URL: http://localhost:8000
      PROVIDER_NAME: ${PROVIDER_NAME:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DEPLOYMENT_DEFAULT_IMAGE: nginx:alpine
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: airuntime
      S3_SECRET_KEY: airuntime-secret
      S3_BUCKET: airuntime-files
      DEPLOYMENT_VOLUMES_DIR: ${DEPLOYMENT_VOLUMES_DIR:-/var/lib/airuntime/volumes}
    command: ["sh", "/app/entrypoint.sh", "worker"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - airruntime_projects_data:/data/airruntime-projects
      - ${DEPLOYMENT_VOLUMES_DIR:-/var/lib/airuntime/volumes}:${DEPLOYMENT_VOLUMES_DIR:-/var/lib/airuntime/volumes}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

  # Build source only, as of the per-turn isolation rework (see codex_worker.py) - the worker
  # launches a fresh, single-purpose container from this image per Codex turn instead of `docker
  # exec`-ing into one long-lived instance, so nothing here needs to actually run by default.
  # `docker compose build codex` (or `up --build`, which still builds every service regardless of
  # profile) produces the image; profile keeps `up` from also starting an idle instance of it.
  codex:
    build:
      context: .
      dockerfile: deployment/codex/Dockerfile
    logging: *default-logging
    profiles: ["build-only"]

  # Narrows the per-turn Codex container's Docker access from the raw host socket down to a
  # vetted API subset - opt in by setting CODEX_DOCKER_HOST=tcp://docker-socket-proxy:2375 (see
  # config.py's codex_docker_host). Until that's set, Codex containers fall back to the raw
  # socket, same trust level as before this service existed.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    logging: *default-logging
    environment:
      CONTAINERS: 1
      IMAGES: 1
      EXEC: 1
      BUILD: 1
      POST: 1
      NETWORKS: 1
      VOLUMES: 0
      SWARM: 0
      SERVICES: 0
      NODES: 0
      PLUGINS: 0
      SECRETS: 0
      CONFIGS: 0
      SYSTEM: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  django-admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    logging: *default-logging
    environment:
      DJANGO_SECRET_KEY: change-me
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:8001
      DJANGO_SUPERUSER_EMAIL: admin@airuntime.ru
      DJANGO_SUPERUSER_PASSWORD: admin123
      POSTGRES_DB: airuntime
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: postgres
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
        NEXT_PUBLIC_BASE_DOMAIN: airuntime.ru
    logging: *default-logging
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_BASE_DOMAIN: airuntime.ru
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
  airruntime_projects_data:
